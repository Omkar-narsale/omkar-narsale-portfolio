      <text x="110" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="600">Sameer Khan</text>
      <text x="240" y="30" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">54% (Low)</text>
      <text x="360" y="30" fill="#f59e0b" font-family="monospace" font-size="12">5.8 / 10</text>
      <rect x="430" y="14" width="75" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" />
      <text x="467" y="29" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="700">HIGH RISK</text>
      <text x="540" y="30" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Notify HOD</text>
