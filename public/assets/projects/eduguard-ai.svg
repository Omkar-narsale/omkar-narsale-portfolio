    <rect x="286" y="0" width="260" height="95" rx="14" fill="url(#eg-card)" stroke="#334155" stroke-width="1.2" />
    <text x="310" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">High Risk of Dropout</text>
    <text x="310" y="68" fill="#f87171" font-family="system-ui" font-size="28" font-weight="800">84</text>
    <text x="470" y="66" fill="#fca5a5" font-family="monospace" font-size="12">Flagged</text>

    <rect x="572" y="0" width="260" height="95" rx="14" fill="url(#eg-card)" stroke="#334155" stroke-width="1.2" />
    <text x="596" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">Early Interventions Done</text>
    <text x="596" y="68" fill="#10b981" font-family="system-ui" font-size="28" font-weight="800">62</text>
