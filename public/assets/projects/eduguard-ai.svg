      <rect width="390" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="25" y="32" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="700">Hackathon Prototype Highlights</text>
      <text x="25" y="55" fill="#94a3b8" font-family="system-ui" font-size="12">Built during SAKEC College Hackathon</text>
      <text x="25" y="75" fill="#34d399" font-family="monospace" font-size="11">✔ Automated counselor notification email trigger</text>
    </g>
