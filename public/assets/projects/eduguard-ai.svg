      <text x="0" y="18" fill="#F2F4F6" font-family="system-ui" font-size="12">Consecutive Class Absences (Weight: 42%)</text>
      <rect x="0" y="26" width="380" height="14" rx="7" fill="#0f172a" />
      <rect x="0" y="26" width="280" height="14" rx="7" fill="#ef4444" />

      <text x="0" y="70" fill="#F2F4F6" font-family="system-ui" font-size="12">Internal Exam Score Drop (Weight: 28%)</text>
      <rect x="0" y="78" width="380" height="14" rx="7" fill="#0f172a" />
      <rect x="0" y="78" width="200" height="14" rx="7" fill="#f59e0b" />

      <text x="0" y="122" fill="#F2F4F6" font-family="system-ui" font-size="12">Assignment Submission Delay (Weight: 18%)</text>
      <rect x="0" y="130" width="380" height="14" rx="7" fill="#0f172a" />
      <rect x="0" y="130" width="130" height="14" rx="7" fill="#38bdf8" />

      <text x="0" y="174" fill="#F2F4F6" font-family="system-ui" font-size="12">Extracurricular Disengagement (Weight: 12%)</text>
      <rect x="0" y="182" width="380" height="14" rx="7" fill="#0f172a" />
      <rect x="0" y="182" width="85" height="14" rx="7" fill="#9FCAFC" />
