    <g transform="translate(28, 246)">
      <rect width="604" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12">#IT-2024-112</text>
      <text x="110" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="600">Rohan Varma</text>
      <text x="240" y="30" fill="#10b981" font-family="monospace" font-size="12">89%</text>
      <text x="360" y="30" fill="#10b981" font-family="monospace" font-size="12">8.6 / 10</text>
      <rect x="430" y="14" width="75" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
      <text x="467" y="29" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">LOW RISK</text>
      <text x="540" y="30" fill="#94a3b8" font-family="system-ui" font-size="12">Monitoring</text>
