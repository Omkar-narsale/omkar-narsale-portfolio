      <text x="80" y="35" fill="#F2F4F6" font-family="system-ui" font-size="14" font-weight="700">Dr. Ananya Nair</text>
      <text x="80" y="53" fill="#94a3b8" font-family="system-ui" font-size="12">Senior Neurologist · Shift: 12:00 - 20:00</text>
      <text x="80" y="70" fill="#f59e0b" font-family="monospace" font-size="11">● In Emergency Surgery (OT-2)</text>
