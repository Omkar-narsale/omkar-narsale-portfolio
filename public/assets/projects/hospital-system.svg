    <text x="596" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">On-Duty Doctors</text>
    <text x="596" y="68" fill="#F2F4F6" font-family="system-ui" font-size="28" font-weight="800">42</text>
    <text x="770" y="66" fill="#34d399" font-family="monospace" font-size="12">Active</text>

    <rect x="858" y="0" width="262" height="95" rx="14" fill="url(#hs-card)" stroke="#334155" stroke-width="1.2" />
    <text x="882" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">Available ICU Units</text>
