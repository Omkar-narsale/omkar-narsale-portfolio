    <g transform="translate(28, 306)">
      <rect width="604" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12">#PT-4105</text>
      <text x="120" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="600">Sneha Patil</text>
