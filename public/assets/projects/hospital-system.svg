      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12">#PT-4104</text>
      <text x="120" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="600">Anand Mehta</text>
      <text x="260" y="30" fill="#94a3b8" font-family="system-ui" font-size="13">Orthopedics</text>
