      <text x="447" y="29" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">ADMITTED</text>
      <text x="535" y="30" fill="#F2F4F6" font-family="monospace" font-size="12">O-210</text>
    </g>

