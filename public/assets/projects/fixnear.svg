      <line x1="20" y1="170" x2="20" y2="215" stroke="#334155" stroke-width="3" stroke-dasharray="3 3" />
      <text x="45" y="158" fill="#64748b" font-family="system-ui" font-size="13">Service in Progress</text>

      <!-- Step 4 (Pending) -->
