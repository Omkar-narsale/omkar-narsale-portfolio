    <text x="40" y="420" fill="#94a3b8" font-family="system-ui" font-size="12">Backend: <tspan fill="#10b981">Node.js + Express REST APIs</tspan></text>
    <text x="40" y="445" fill="#94a3b8" font-family="system-ui" font-size="12">Database: <tspan fill="#34d399">MongoDB Atlas Cluster</tspan></text>
    <text x="40" y="470" fill="#94a3b8" font-family="system-ui" font-size="12">Deployment: <tspan fill="#9FCAFC">Vercel (UI) &amp; Render (API)</tspan></text>
