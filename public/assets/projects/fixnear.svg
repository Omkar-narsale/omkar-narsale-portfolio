      <circle cx="20" cy="90" r="8" fill="#ffffff" />
      <line x1="20" y1="104" x2="20" y2="150" stroke="#334155" stroke-width="3" stroke-dasharray="3 3" />
      <text x="45" y="88" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="700">Professional En Route</text>
      <text x="45" y="105" fill="#94a3b8" font-family="monospace" font-size="11">ETA: 12 minutes (Vashi Sec 17)</text>

      <!-- Step 3 (Pending) -->
