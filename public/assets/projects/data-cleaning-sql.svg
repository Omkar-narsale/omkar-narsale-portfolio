<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sql-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="sql-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#sql-bg)" />

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="1120" height="64" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="75" cy="62" r="8" fill="#ef4444" />
  <circle cx="100" cy="62" r="8" fill="#f59e0b" />
  <circle cx="125" cy="62" r="8" fill="#10b981" />

  <text x="160" y="68" fill="#F2F4F6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Data Hygiene &amp; Standardization Engine</text>
  <rect x="585" y="49" width="175" height="26" rx="13" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="672" y="67" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">ADVANCED SQL WINDOWS</text>

  <rect x="980" y="47" width="155" height="30" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="1057" y="67" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12">MySQL · PostgreSQL</text>

  <!-- Left: Raw Messy Data vs Cleaned Gold Table Transformation -->
  <g transform="translate(40, 115)">
    <rect width="640" height="520" rx="16" fill="url(#sql-card)" stroke="#334155" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">Raw Dirty Records Ingestion</text>
    <text x="28" y="58" fill="#fca5a5" font-family="monospace" font-size="11">Duplicates · Inconsistent Casing · Null Dates · Format Drift</text>

    <!-- Raw Messy Table -->
    <g transform="translate(28, 80)">
      <rect width="584" height="130" rx="10" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1" />
      <text x="20" y="30" fill="#fca5a5" font-family="monospace" font-size="11">RAW UNCLEANED TABLE [customers_raw]</text>
      
      <!-- Headers -->
      <text x="20" y="55" fill="#fecaca" font-family="monospace" font-size="11">ID | NAME | JOIN_DATE | EMAIL | STATUS</text>
      <text x="20" y="78" fill="#f87171" font-family="monospace" font-size="11">101 | "john doe" | 02/03/2023 | john@ex.com | NULL (Duplicate)</text>
      <text x="20" y="98" fill="#f87171" font-family="monospace" font-size="11">101 | "John Doe" | 2023-03-02 | JOHN@EX.COM | "ACTIVE"</text>
      <text x="20" y="118" fill="#f87171" font-family="monospace" font-size="11">102 | "  sarah M." | 14-May-24 | NULL | "Pending"</text>
    </g>

    <!-- Downward SQL Transformation Arrow -->
    <g transform="translate(320, 225)">
      <circle cx="0" cy="18" r="16" fill="#1e293b" stroke="#38bdf8" />
      <text x="0" y="23" text-anchor="middle" fill="#38bdf8" font-size="16">↓</text>
    </g>

    <!-- Cleaned Gold Table -->
    <g transform="translate(28, 260)">
      <rect width="584" height="130" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="30" fill="#a7f3d0" font-family="monospace" font-size="11">GOLD MASTER TABLE [dim_customers_cleaned]</text>
      
      <!-- Headers -->
      <text x="20" y="55" fill="#d1fae5" font-family="monospace" font-size="11">CUSTOMER_ID | FULL_NAME | JOIN_DATE | STANDARDIZED_EMAIL | STATUS</text>
      <text x="20" y="80" fill="#6ee7b7" font-family="monospace" font-size="11">101 | "John Doe" | 2023-03-02 | john@ex.com | "ACTIVE"</text>
      <text x="20" y="105" fill="#6ee7b7" font-family="monospace" font-size="11">102 | "Sarah M." | 2024-05-14 | not_provided@domain.com | "PENDING"</text>
      <text x="20" y="123" fill="#a7f3d0" font-family="monospace" font-size="10">✔ 100% Unique Primary Keys · Deduplicated via ROW_NUMBER()</text>
    </g>

    <!-- Metrics Strip -->
    <g transform="translate(28, 415)">
      <rect width="584" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">DATA HYGIENE AUDIT REPORT</text>
      <text x="20" y="55" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">14,200 Duplicates Removed · ISO-8601 Date Uniformity</text>
    </g>
  </g>

  <!-- Right: Advanced SQL Query Script Architecture -->
  <g transform="translate(700, 115)">
    <rect width="460" height="520" rx="16" fill="url(#sql-card)" stroke="#334155" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">SQL Pipeline Scripts</text>
    <text x="28" y="58" fill="#38bdf8" font-family="monospace" font-size="11">Window Functions &amp; Conditional Imputation</text>

    <!-- Code Block 1: Deduplication -->
    <g transform="translate(25, 80)">
      <rect width="410" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#fbbf24" font-family="monospace" font-size="11">-- Deduplication via CTE &amp; Window Function</text>
      <text x="20" y="55" fill="#c084fc" font-family="monospace" font-size="12">WITH RankedDuplicates AS (</text>
      <text x="35" y="78" fill="#38bdf8" font-family="monospace" font-size="12">  SELECT *,</text>
      <text x="35" y="101" fill="#38bdf8" font-family="monospace" font-size="12">  ROW_NUMBER() OVER(</text>
      <text x="50" y="124" fill="#a5b4fc" font-family="monospace" font-size="11">    PARTITION BY customer_id </text>
      <text x="50" y="147" fill="#a5b4fc" font-family="monospace" font-size="11">    ORDER BY updated_at DESC</text>
      <text x="35" y="165" fill="#38bdf8" font-family="monospace" font-size="12">  ) AS row_num FROM raw_table)</text>
    </g>

    <!-- Code Block 2: Handling Nulls and Regex Casing -->
    <g transform="translate(25, 275)">
      <rect width="410" height="150" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#fbbf24" font-family="monospace" font-size="11">-- String Cleaning &amp; Null Imputation</text>
      <text x="20" y="55" fill="#38bdf8" font-family="monospace" font-size="12">SELECT </text>
      <text x="35" y="80" fill="#67e8f9" font-family="monospace" font-size="11">  INITCAP(TRIM(full_name)),</text>
      <text x="35" y="105" fill="#67e8f9" font-family="monospace" font-size="11">  COALESCE(LOWER(email), 'unregistered'),</text>
      <text x="35" y="130" fill="#67e8f9" font-family="monospace" font-size="11">  CASE WHEN status IS NULL THEN 'NEW'...</text>
    </g>

    <text x="35" y="465" fill="#10b981" font-family="monospace" font-size="11">✔ Referential Integrity &amp; Foreign Keys Validated</text>
    <text x="35" y="490" fill="#94a3b8" font-family="monospace" font-size="11">✔ Optimized Indexes on PARTITION columns</text>
  </g>
</svg>
