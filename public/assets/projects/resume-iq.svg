<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="riq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="riq-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#riq-bg)" />

  <!-- Top Navigation Header -->
  <rect x="40" y="30" width="1120" height="64" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="75" cy="62" r="8" fill="#ef4444" />
  <circle cx="100" cy="62" r="8" fill="#f59e0b" />
  <circle cx="125" cy="62" r="8" fill="#10b981" />

  <text x="160" y="68" fill="#F2F4F6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">ResumeIQ — AI Resume Intelligence</text>
  <rect x="545" y="49" width="195" height="26" rx="13" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" />
  <text x="642" y="67" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="600">SEMANTIC ATS EMBEDDINGS</text>

  <rect x="980" y="47" width="155" height="30" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
  <text x="1057" y="67" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="12">FastAPI + LangChain</text>

  <!-- Left: Candidate Resume vs Target Role Scoring -->
  <g transform="translate(40, 115)">
    <rect width="650" height="520" rx="16" fill="url(#riq-card)" stroke="#334155" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">Applicant Parsing &amp; Keyword Alignment</text>
    <text x="28" y="58" fill="#94a3b8" font-family="monospace" font-size="11">Sentence Transformers · Cosine Similarity Scoring</text>

    <!-- Match Score Gauge Card -->
    <g transform="translate(28, 80)">
      <rect width="594" height="110" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
      <text x="30" y="42" fill="#94a3b8" font-family="system-ui" font-size="13">Target Role: <tspan fill="#F2F4F6" font-weight="700">Data Engineer / AI Developer</tspan></text>
      <text x="30" y="85" fill="#a5b4fc" font-family="system-ui" font-size="38" font-weight="800">89.4%</text>
      <text x="175" y="75" fill="#34d399" font-family="system-ui" font-size="14" font-weight="700">HIGH ATS COMPATIBILITY</text>
      <text x="175" y="93" fill="#94a3b8" font-family="system-ui" font-size="12">Optimal semantic alignment with recruiter parameters</text>
    </g>

    <!-- Extracted Skills Matrix -->
    <g transform="translate(28, 210)">
      <text x="0" y="20" fill="#F2F4F6" font-family="system-ui" font-size="14" font-weight="700">Identified Technical Skills Taxonomy</text>
      
      <!-- Tags Found -->
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="110" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="55" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ Python</text>

        <rect x="120" y="0" width="110" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="175" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ Pandas</text>

        <rect x="240" y="0" width="110" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="295" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ MySQL</text>

        <rect x="360" y="0" width="110" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="415" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ PyTorch</text>

        <rect x="480" y="0" width="110" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="535" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ Docker</text>
      </g>

      <!-- Second Row of Tags -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="130" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="65" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ Fast API REST</text>

        <rect x="140" y="0" width="130" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
        <text x="205" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ MediaPipe</text>

        <rect x="280" y="0" width="140" height="30" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" />
        <text x="350" y="20" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="11">⚠ Kubernetes (Gap)</text>

        <rect x="430" y="0" width="130" height="30" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" />
        <text x="495" y="20" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="11">⚠ Apache Spark</text>
      </g>
    </g>

    <!-- Parsing Details Box -->
    <rect x="28" y="360" width="594" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="45" y="390" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="700">Semantic Vector Analysis</text>
    <text x="45" y="415" fill="#94a3b8" font-family="system-ui" font-size="12">Dense Embeddings Model: <tspan fill="#38bdf8">all-MiniLM-L6-v2</tspan></text>
    <text x="45" y="438" fill="#94a3b8" font-family="system-ui" font-size="12">Hard Skill Alignment: <tspan fill="#10b981" font-weight="700">92%</tspan> | Soft Skill Alignment: <tspan fill="#fbbf24" font-weight="700">84%</tspan></text>
    <text x="45" y="460" fill="#94a3b8" font-family="system-ui" font-size="12">Processing Time: <tspan fill="#a5b4fc">340 ms per PDF resume</tspan></text>
  </g>

  <!-- Right: Automated Resume Bullet Optimizer -->
  <g transform="translate(710, 115)">
    <rect width="450" height="520" rx="16" fill="url(#riq-card)" stroke="#334155" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">AI Bullet Point Recommendations</text>
    <text x="28" y="58" fill="#818cf8" font-family="monospace" font-size="11">Automated Action Verb &amp; Metric Enhancement</text>

    <!-- Weak Bullet Example -->
    <g transform="translate(25, 80)">
      <rect width="400" height="85" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
      <text x="20" y="25" fill="#fca5a5" font-family="monospace" font-size="11">ORIGINAL DRAFT (WEAK IMPACT):</text>
      <text x="20" y="50" fill="#fecaca" font-family="system-ui" font-size="12">"Worked on building a data pipeline for retail sales using python."</text>
    </g>

    <!-- Enhanced Bullet -->
    <g transform="translate(25, 180)">
      <rect width="400" height="110" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="25" fill="#a7f3d0" font-family="monospace" font-size="11">AI OPTIMIZED (STRONG METRICS):</text>
      <text x="20" y="50" fill="#d1fae5" font-family="system-ui" font-size="12" font-weight="600">"Architected automated Python ETL pipeline with Watchdog and MySQL, processing 1.4M+ transactions with 99.9% data integrity."</text>
      <text x="20" y="95" fill="#6ee7b7" font-family="monospace" font-size="10">Impact Score: +38% ATS Recruiter Visibility</text>
    </g>

    <!-- ATS Best Practices Box -->
    <g transform="translate(25, 310)">
      <rect width="400" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="700">ATS Checklist Verification</text>
      <text x="20" y="60" fill="#10b981" font-family="system-ui" font-size="12">✔ Clean single-column layout formatting</text>
      <text x="20" y="85" fill="#10b981" font-family="system-ui" font-size="12">✔ Standard header naming conventions</text>
      <text x="20" y="110" fill="#10b981" font-family="system-ui" font-size="12">✔ Quantified achievement metrics included</text>
      <text x="20" y="135" fill="#10b981" font-family="system-ui" font-size="12">✔ Zero unparseable graphic tables</text>
      <text x="20" y="158" fill="#38bdf8" font-family="monospace" font-size="11">Ready for Applicant Tracking Systems</text>
    </g>
  </g>
</svg>
