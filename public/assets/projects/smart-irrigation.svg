<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ir-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="100%" stop-color="#0f291e" />
    </linearGradient>
    <linearGradient id="ir-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143828" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b2418" stop-opacity="0.98" />
    </linearGradient>
    <pattern id="ir-circuit" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 20 L 20 40 M 20 0 L 20 20 L 40 20" fill="none" stroke="#1b4d36" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ir-bg)" />
  <rect width="1200" height="675" fill="url(#ir-circuit)" />

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="1120" height="64" rx="16" fill="#143828" stroke="#22543d" stroke-width="1.5" />
  <circle cx="75" cy="62" r="8" fill="#ef4444" />
  <circle cx="100" cy="62" r="8" fill="#f59e0b" />
  <circle cx="125" cy="62" r="8" fill="#10b981" />

  <text x="160" y="68" fill="#F2F4F6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">AgriSense — Smart Automated Irrigation System</text>
  <rect x="670" y="49" width="165" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
  <text x="752" y="67" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">ARDUINO / IOT SIM</text>

  <rect x="990" y="47" width="145" height="30" rx="8" fill="#061c14" stroke="#10b981" stroke-width="1" />
  <circle cx="1010" cy="62" r="5" fill="#10b981" />
  <text x="1025" y="67" fill="#34d399" font-family="monospace" font-size="12">Telemetry Live</text>

  <!-- Left: IoT Circuit Simulation & Hardware Schematic -->
  <g transform="translate(40, 115)">
    <rect width="640" height="520" rx="16" fill="url(#ir-card)" stroke="#22543d" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">Hardware Circuit &amp; Sensor Interfacing</text>
    <text x="28" y="58" fill="#a7f3d0" font-family="monospace" font-size="11">Arduino Uno / ESP8266 · Analog Soil Moisture Sensor</text>

    <!-- Circuit Diagram Representation -->
    <!-- Arduino Microcontroller Board -->
    <g transform="translate(40, 90)">
      <rect width="240" height="280" rx="14" fill="#006699" stroke="#38bdf8" stroke-width="2" />
      <rect x="15" y="20" width="50" height="40" rx="4" fill="#64748b" />
      <text x="40" y="45" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">USB</text>

      <rect x="15" y="220" width="40" height="40" rx="4" fill="#1e293b" />
      <text x="35" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">PWR</text>

      <!-- ATmega Chip -->
      <rect x="100" y="90" width="110" height="110" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="155" y="145" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">ATmega328P</text>
      <text x="155" y="165" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">16MHz</text>

      <!-- Digital Pins Header -->
      <rect x="15" y="0" width="210" height="14" fill="#1e293b" />
      <text x="120" y="11" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">DIGITAL PINS (PWM)</text>

      <!-- Analog In Pins Header -->
      <rect x="15" y="266" width="210" height="14" fill="#1e293b" />
      <text x="120" y="277" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">ANALOG IN (A0 - A5)</text>

      <text x="120" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">ARDUINO UNO</text>
    </g>

    <!-- Wires connecting to Soil Moisture Sensor -->
    <path d="M 280 340 L 400 340 L 400 200 L 460 200" fill="none" stroke="#10b981" stroke-width="3" />
    <text x="340" y="330" fill="#a7f3d0" font-family="monospace" font-size="10">Pin A0 (Analog)</text>

    <!-- Soil Moisture Probe -->
    <g transform="translate(460, 120)">
      <rect width="130" height="160" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="30" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700">Soil Moisture</text>
      <text x="65" y="48" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">Capacitive Sensor</text>

      <!-- Probes in soil -->
      <line x1="45" y1="75" x2="45" y2="140" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
      <line x1="85" y1="75" x2="85" y2="140" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
      <rect x="25" y="125" width="80" height="25" rx="4" fill="#78350f" fill-opacity="0.8" />
      <text x="65" y="142" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="10">Moist Soil</text>
    </g>

    <!-- 5V Relay & Solenoid Water Valve -->
    <g transform="translate(350, 390)">
      <rect width="250" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="20" y="20" width="60" height="60" rx="8" fill="#0284c7" />
      <text x="50" y="55" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">RELAY</text>
      <text x="100" y="45" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="700">12V Solenoid Valve</text>
      <text x="100" y="65" fill="#38bdf8" font-family="monospace" font-size="11">Status: Pumping H2O</text>
      <text x="100" y="85" fill="#a7f3d0" font-family="monospace" font-size="10">Flow Rate: 4.2 L/min</text>
    </g>
  </g>

  <!-- Right: Automated Water Management Dashboard -->
  <g transform="translate(710, 115)">
    <rect width="450" height="520" rx="16" fill="url(#ir-card)" stroke="#22543d" stroke-width="1.2" />
    <text x="28" y="38" fill="#F2F4F6" font-family="system-ui" font-size="16" font-weight="700">Real-Time Soil Telemetry</text>
    <text x="28" y="58" fill="#34d399" font-family="monospace" font-size="11">Threshold Logic: If Moisture &lt; 35% → Trigger Valve</text>

    <!-- Moisture Gauge Tile -->
    <g transform="translate(25, 80)">
      <rect width="400" height="140" rx="14" fill="#061c14" stroke="#22543d" stroke-width="1.2" />
      <text x="25" y="35" fill="#a7f3d0" font-family="system-ui" font-size="13">Current Soil Moisture Level</text>
      <text x="25" y="85" fill="#F2F4F6" font-family="system-ui" font-size="44" font-weight="800">42%</text>
      <text x="150" y="80" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">OPTIMAL RANGE</text>
      
      <!-- Progress Bar -->
      <rect x="25" y="105" width="350" height="14" rx="7" fill="#143828" />
      <rect x="25" y="105" width="147" height="14" rx="7" fill="#10b981" />
    </g>

    <!-- Micro-metrics Grid -->
    <g transform="translate(25, 235)">
      <rect x="0" y="0" width="190" height="85" rx="10" fill="#061c14" stroke="#22543d" stroke-width="1" />
      <text x="20" y="28" fill="#a7f3d0" font-family="system-ui" font-size="12">Ambient Temperature</text>
      <text x="20" y="60" fill="#F2F4F6" font-family="system-ui" font-size="22" font-weight="700">28.4 °C</text>

      <rect x="210" y="0" width="190" height="85" rx="10" fill="#061c14" stroke="#22543d" stroke-width="1" />
      <text x="230" y="28" fill="#a7f3d0" font-family="system-ui" font-size="12">Air Humidity (DHT11)</text>
      <text x="230" y="60" fill="#F2F4F6" font-family="system-ui" font-size="22" font-weight="700">65%</text>
    </g>

    <!-- Automated Event Log -->
    <g transform="translate(25, 335)">
      <rect width="400" height="155" rx="12" fill="#061c14" stroke="#22543d" stroke-width="1" />
      <text x="20" y="30" fill="#F2F4F6" font-family="system-ui" font-size="13" font-weight="700">Automated Watering Log</text>
      <text x="20" y="55" fill="#34d399" font-family="monospace" font-size="11">● 06:00 AM — Scheduled 5 min drip cycle completed</text>
      <text x="20" y="80" fill="#34d399" font-family="monospace" font-size="11">● 11:30 AM — Moisture dropped to 29% → Auto-pump ON</text>
      <text x="20" y="105" fill="#34d399" font-family="monospace" font-size="11">● 11:34 AM — Moisture restored to 44% → Auto-pump OFF</text>
      <text x="20" y="132" fill="#a7f3d0" font-family="monospace" font-size="11">Water Saved: 38% compared to manual irrigation</text>
    </g>
  </g>
</svg>

